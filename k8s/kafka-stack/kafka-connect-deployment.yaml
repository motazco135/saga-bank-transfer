apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose-redis.yml -o k8s
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: kafka-connect
  name: kafka-connect
  namespace: kafka-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: kafka-connect
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose-redis.yml -o k8s
        kompose.version: 1.35.0 (HEAD)
      labels:
        io.kompose.service: kafka-connect
    spec:
      containers:
        - args:
            - bash
            - -c
            - "echo \"Installing Connector\"\nconfluent-hub install --no-prompt confluentinc/kafka-connect-jdbc:latest\nconfluent-hub install --no-prompt debezium/debezium-connector-postgresql:latest\nconfluent-hub install --no-prompt apacheignite/kafka-ignite-sink:latest\nconfluent-hub install --no-prompt jcustenborder/kafka-connect-redis:latest \n#\necho \"Launching Kafka Connect worker\"\n/etc/confluent/docker/run &\n#\nsleep infinity\n"
          env:
            - name: CONNECT_BOOTSTRAP_SERVERS
              value: broker.kafka-stack.svc.cluster.local:29092
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_CONFIG_STORAGE_TOPIC
              value: _connect-configs
            - name: CONNECT_GROUP_ID
              value: kafka-connect
            - name: CONNECT_KEY_CONVERTER
              value: org.apache.kafka.connect.storage.StringConverter
            - name: CONNECT_LOG4J_APPENDER_STDOUT_LAYOUT_CONVERSIONPATTERN
              value: '[%d] %p %X{connector.context}%m (%c:%L)%n'
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_OFFSET_STORAGE_TOPIC
              value: _connect-offsets
            - name: CONNECT_PLUGIN_PATH
              value: /usr/share/java,/usr/share/confluent-hub-components,/data/connect-jars
            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              value: kafka-connect
            - name: CONNECT_REST_PORT
              value: "8083"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_STATUS_STORAGE_TOPIC
              value: _connect-status
            - name: CONNECT_VALUE_CONVERTER
              value: io.confluent.connect.avro.AvroConverter
            - name: CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL
              value: http://schema-registry:8081
          image: confluentinc/cp-kafka-connect-base:latest
          name: kafka-connect
          ports:
            - containerPort: 8083
              protocol: TCP
          volumeMounts:
            - mountPath: /data
              name: kafka-connect-cm0
      restartPolicy: Always
      volumes:
        - configMap:
            name: kafka-connect-cm0
          name: kafka-connect-cm0
