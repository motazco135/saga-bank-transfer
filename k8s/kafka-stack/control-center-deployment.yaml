apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose-redis.yml -o k8s
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: control-center
  name: control-center
  namespace: kafka-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: control-center
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose-redis.yml -o k8s
        kompose.version: 1.35.0 (HEAD)
      labels:
        io.kompose.service: control-center
    spec:
      containers:
        - args:
            - bash
            - -c
            - "echo \"Waiting two minutes for Kafka brokers to start and \n       necessary topics to be available\"\nsleep 120  \n/etc/confluent/docker/run\n"
          env:
            - name: CONFLUENT_METRICS_TOPIC_REPLICATION
              value: "1"
            - name: CONTROL_CENTER_BOOTSTRAP_SERVERS
              value: broker.kafka-stack.svc.cluster.local:29092
            - name: CONTROL_CENTER_CONNECT_CONNECT_CLUSTER
              value: kafka-connect:8083
            - name: CONTROL_CENTER_CONNECT_HEALTHCHECK_ENDPOINT
              value: /connectors
            - name: CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS
              value: "1"
            - name: CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS
              value: "1"
            - name: CONTROL_CENTER_REPLICATION_FACTOR
              value: "1"
            - name: CONTROL_CENTER_SCHEMA_REGISTRY_URL
              value: http://schema-registry.kafka-stack.svc.cluster.local:8081
            - name: PORT
              value: "9021"
          image: confluentinc/cp-enterprise-control-center:7.4.0
          name: control-center
          ports:
            - containerPort: 9021
              protocol: TCP
      hostname: control-center
      restartPolicy: Always
