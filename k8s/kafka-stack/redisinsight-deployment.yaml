apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose-redis.yml -o k8s
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: redisinsight
  name: redisinsight
  namespace: kafka-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: redisinsight
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose-redis.yml -o k8s
        kompose.version: 1.35.0 (HEAD)
      labels:
        io.kompose.service: redisinsight
    spec:
      containers:
        - image: redis/redisinsight:latest
          name: redisinsight
          ports:
            - containerPort: 5540
              protocol: TCP
      hostname: redisinsight
      restartPolicy: Always
