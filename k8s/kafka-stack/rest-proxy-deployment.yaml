apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose-redis.yml -o k8s
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: rest-proxy
  name: rest-proxy
  namespace: kafka-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: rest-proxy
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose-redis.yml -o k8s
        kompose.version: 1.35.0 (HEAD)
      labels:
        io.kompose.service: rest-proxy
    spec:
      containers:
        - env:
            - name: KAFKA_REST_BOOTSTRAP_SERVERS
              value: broker.kafka-stack.svc.cluster.local:29092
            - name: KAFKA_REST_HOST_NAME
              value: rest-proxy
            - name: KAFKA_REST_LISTENERS
              value: http://0.0.0.0:8082
            - name: KAFKA_REST_SCHEMA_REGISTRY_URL
              value: http://schema-registry.kafka-stack.svc.cluster.local:8081
          image: confluentinc/cp-kafka-rest:7.4.0
          name: rest-proxy
          ports:
            - containerPort: 8082
              protocol: TCP
      hostname: rest-proxy
      restartPolicy: Always
