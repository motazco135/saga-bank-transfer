apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: account-service:1.0
          ports:
            - containerPort: 8086
          livenessProbe:
            httpGet:
              path: /api/account/actuator/health
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/account/actuator/health
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10